x-validation-precedence:
  description: Orden normativo para clasificar errores detectados antes o durante la ejecución SQL. La capa API debe 
    producir el mismo código funcional específico cuando replique una validación del SP.
  rules:
  - order: 1
    condition: JSON ilegible, cuerpo no deserializable o tipo JSON incompatible
    httpStatus: 400
    apiCode: GL-API-REQ-001
  - order: 2
    condition: Regla específica de la operación que replica una validación SQL controlada
    httpStatus: 422
    apiCode: Código GL-CORTE-* o GL-PEND-* correspondiente, aunque la API la detecte antes de ejecutar el SP
  - order: 3
    condition: Validación de contrato sin código funcional específico
    httpStatus: 422
    apiCode: GL-API-REQ-002
  - order: 4
    condition: El Stored Procedure devuelve un error controlado
    httpStatus: Según x-sql-errors
    apiCode: Exactamente el mismo código funcional definido para esa condición
