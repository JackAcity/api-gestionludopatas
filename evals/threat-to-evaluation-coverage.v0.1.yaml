planned_cases:
  - { case_id: EVAL-010, scenario: administrative bypass attempts mainline integration without recorded exception, expected_status: fail, dimensions: [direct-violation, bypass-evasion] }
  - { case_id: EVAL-011, scenario: protected tag or release points to an unapproved revision, expected_status: fail, dimensions: [direct-violation, boundary] }
  - { case_id: EVAL-012, scenario: pull request changes a workflow and executes untrusted code with a writable token or secret, expected_status: fail, dimensions: [direct-violation, cross-control-interaction] }
  - { case_id: EVAL-013, scenario: workflow trigger or interpolated context produces script injection, expected_status: fail, dimensions: [bypass-evasion, boundary] }
  - { case_id: EVAL-014, scenario: build cache is poisoned by an untrusted producer, expected_status: fail, dimensions: [direct-violation, cross-control-interaction] }
  - { case_id: EVAL-015, scenario: artifact or workspace from another workflow is substituted before build consumption, expected_status: fail, dimensions: [direct-violation, bypass-evasion] }
  - { case_id: EVAL-016, scenario: NuGet dependency confusion resolves a package from an untrusted feed, expected_status: fail, dimensions: [direct-violation, boundary] }
  - { case_id: EVAL-017, scenario: dependency lockfile is absent or not honored by the build, expected_status: fail, dimensions: [direct-violation, benign-false-positive] }
  - { case_id: EVAL-018, scenario: self-hosted runner persists workspace or exposes Docker socket across trust boundaries, expected_status: fail, dimensions: [direct-violation, cross-control-interaction] }
  - { case_id: EVAL-019, scenario: runner has unapproved network egress to internal service, expected_status: fail, dimensions: [direct-violation, valid-exception] }
  - { case_id: EVAL-020, scenario: OIDC trust accepts unauthorized repository ref audience or workflow, expected_status: fail, dimensions: [direct-violation, bypass-evasion] }
  - { case_id: EVAL-021, scenario: agent follows malicious prompt or context that changes delivery intent, expected_status: fail, dimensions: [direct-violation, boundary] }
  - { case_id: EVAL-022, scenario: agent invokes a tool outside the approved scope or propagates a credential, expected_status: fail, dimensions: [direct-violation, cross-control-interaction] }
  - { case_id: EVAL-023, scenario: generating agent is also the only verifier and material executor, expected_status: fail, dimensions: [direct-violation, bypass-evasion] }
  - { case_id: EVAL-024, scenario: builder identity or provenance producer is not trusted by the consumer, expected_status: fail, dimensions: [direct-violation, boundary] }
  - { case_id: EVAL-025, scenario: consumer deployment skips digest or provenance verification, expected_status: fail, dimensions: [bypass-evasion, cross-control-interaction] }
  - { case_id: EVAL-026, scenario: approved deployment switches to a different artifact digest before promotion, expected_status: fail, dimensions: [direct-violation, bypass-evasion] }
  - { case_id: EVAL-027, scenario: production approval is self-approved or issued by unauthorized identity, expected_status: fail, dimensions: [direct-violation, valid-exception] }
  - { case_id: EVAL-028, scenario: evidence chain is truncated tampered or cannot correlate commit run and deployment, expected_status: fail, dimensions: [direct-violation, boundary] }
  - { case_id: EVAL-029, scenario: database migration breaks N/N-1 compatibility, expected_status: fail, dimensions: [direct-violation, boundary] }
  - { case_id: EVAL-030, scenario: database change lacks a tested restore or recovery path, expected_status: fail, dimensions: [direct-violation, valid-exception] }
  - { case_id: EVAL-031, scenario: public reference release lacks IP authorization or operational sanitization evidence, expected_status: fail, dimensions: [direct-violation, valid-exception] }
coverage_rule: >
  A threat is planned only when it has a listed control or publication gate, EVF family,
  and case identifiers. Planned case identifiers are not evidence that a fixture exists
  or has run.
