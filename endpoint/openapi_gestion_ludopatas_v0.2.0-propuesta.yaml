openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Gestión de Ludópatas — API SQL propuesta
  version: "0.2.0-propuesta"
  summary: Contrato TO-BE para exponer ocho Stored Procedures AS-BUILT mediante HTTP.
  description: 'Especificación TO-BE versión 0.2.0-propuesta, alineada con PROPUESTA_CONTRATO_API_SQL_GestionLudopatas.md
    y MATRIZ_MAPEO_ERRORES_SQL_HTTP.md. Los endpoints no están implementados ni aprobados. Fuente técnica AS-BUILT: scripts
    SQL vigentes para SQL Server 2019 y bd_autobot.'
  license:
    name: Uso interno — propuesta técnica
servers:
- url: https://api.example.invalid/gestion-ludopatas
  description: URL ilustrativa no real.
- url: https://api-{environment}.example.invalid/gestion-ludopatas
  description: Plantilla ilustrativa no real.
  variables:
    environment:
      default: dev
      enum:
      - dev
      - qa
      - prod
tags:
- name: Cortes
  description: Operaciones propuestas sobre la resolución y creación de cortes.
- name: Pendientes CALIMACO
  description: Consultas propuestas de pendientes CALIMACO.
- name: Pendientes CMP
  description: Consultas propuestas de pendientes CMP.
- name: Pendientes SICA
  description: Consultas propuestas de pendientes SICA.
security:
- OAuth2ClientCredentials:
  - gestion-ludopatas.execute
paths:
  /api/v1/cortes/resoluciones-inicio:
    post:
      tags:
      - Cortes
      summary: Resolver inicio de corte
      description: PROPUESTA TO-BE. Ejecuta la lógica AS-BUILT de dbo.SP_CORTE_ResolverInicio. Puede cerrar cortes 
        vencidos y devuelve exactamente una resolución. Resolver y crear continúan siendo operaciones separadas y no 
        atómicas.
      operationId: resolverInicioCorte
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolverInicioRequest'
      responses:
        '200':
          description: Resolución calculada.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceIdHeader'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayedHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverInicioResponse'
              example:
                accion: RETOMA
                corteId: 125
                corteColgadoOficialId:
                corteColgadoManualId: 124
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ResolverInicioUnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - OAuth2ClientCredentials:
        - gestion-ludopatas.execute
      x-contract-status: proposed-to-be
      x-sql-stored-procedure: dbo.SP_CORTE_ResolverInicio
      x-sql-tables:
      - dbo.Corte
      x-sql-errors:
      - sqlErrorNumber: 51000
        httpStatus: 422
        apiCode: GL-CORTE-RES-001
        retryable: false
      - sqlErrorNumber: 51001
        httpStatus: 422
        apiCode: GL-CORTE-RES-002
        retryable: false
      - sqlErrorNumber: 51002
        httpStatus: 409
        apiCode: GL-CORTE-RES-003
        retryable: false
      - sqlErrorNumber: 51003
        httpStatus: 409
        apiCode: GL-CORTE-RES-004
        retryable: false
      - sqlErrorNumber: 51004
