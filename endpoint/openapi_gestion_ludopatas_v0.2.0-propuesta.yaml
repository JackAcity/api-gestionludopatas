    ApiError:
      type: object
      description: Modelo común TO-BE para errores funcionales y técnicos. No expone stack trace, consultas, 
        credenciales ni detalles sensibles del motor.
      required:
      - type
      - title
      - status
      - code
      - detail
      - traceId
      - timestamp
      - retryable
      - source
      properties:
        type:
          type: string
          format: uri
          description: URI estable que identifica la familia del error.
        title:
          type: string
          description: Resumen humano estable del error.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP de la respuesta.
        code:
          type: string
          pattern: ^GL-[A-Z0-9-]+$
          description: Código funcional/técnico estable de la API.
        detail:
          type: string
          description: Detalle seguro para el consumidor; no incluye información sensible.
        traceId:
          type: string
          minLength: 1
          description: Identificador de trazabilidad extremo a extremo. Debe correlacionar UiPath, API y logs internos.
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora de generación del error en formato RFC 3339.
        retryable:
          type: boolean
          description: Indica si el cliente puede considerar un reintento técnico controlado.
        source:
          type: string
          enum:
          - api
          - sql
          - security
          - network
          description: Capa que clasificó el error; no revela componentes internos innecesarios.
        sqlErrorNumber:
          type:
          - integer
          - 'null'
          description: Número SQL controlado, incluido solo cuando es seguro y útil para soporte.
          minimum: 1
          format: int32
          maximum: 2147483647
        violations:
          type:
          - array
          - 'null'
          description: Errores de validación por campo, cuando corresponda.
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
