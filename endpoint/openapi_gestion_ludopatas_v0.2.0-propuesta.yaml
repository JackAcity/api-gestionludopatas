components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: 'PROPUESTA recomendada para UiPath → API: OAuth 2.0 Client Credentials con identidad técnica por ambiente
        y scopes mínimos.'
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            gestion-ludopatas.execute: Ejecutar las operaciones propuestas de cortes y pendientes.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: PROPUESTA alternativa NO ACTIVA en esta especificación. Se conserva solo para análisis comparativo; 
        ninguna operación la acepta. Requeriría aprobación, rotación, almacenamiento seguro, restricción por red y 
        monitoreo.
      x-active: false
      x-contract-status: alternative-not-active
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador opcional enviado por UiPath. La API debe generar uno cuando no se reciba.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: uipath-job-20260804-000126
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: PROPUESTA obligatoria para crear cortes. Debe ser única por intención de negocio y ambiente durante 
        la vigencia configurada.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: cut-20260805-0700-official-job-84219
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: PROPUESTA opcional para repetir de forma consistente la respuesta de resolver inicio ante un timeout 
        del cliente.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: resolve-start-job-84219-attempt-1
  headers:
    TraceIdHeader:
      description: Identificador de trazabilidad de la respuesta.
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyReplayedHeader:
